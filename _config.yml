# Site settings (LJT-Homepage - Junteng Liu)
locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu is a First-year PhD candidate at the HKUST NLP Group; his research focuses on natural language processing and machine learning."
url: https://eastiasleeve94.github.io
baseurl: "/LJT-Homepage"
repository: "Eastiasleeve94/LJT-Homepage"

# Site author / sidebar profile (from personal details in memory)
author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate at the HKUST NLP Group. Graduated from Shanghai Jiao Tong University (SJTU) in June 2024. Research focuses on natural language processing and machine learning; research interests include LLM Reasoning and Reinforcement Learning, Hallucination in Vision-Language Models (VLM), and LLM Truthfulness and Interpretability."
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Markdown processing
markdown: kramdown
highlighter: rouge
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
